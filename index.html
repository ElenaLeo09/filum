<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Filum — Цифровой холст</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Базовые цветовые схемы */
        :root {
            /* Минимализм (по умолчанию) */
            --bg-color: #f9fafb;
            --surface-color: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #e5e7eb;
        }

        [data-theme="neon"] {
            --bg-color: #09090b;
            --surface-color: #18181b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --border-color: #27272a;
        }

        [data-theme="cyberdark"] {
            --bg-color: #000000;
            --surface-color: #111111;
            --text-main: #ededed;
            --text-muted: #888888;
            --accent-color: #00ff9d;
            --accent-hover: #00cc7e;
            --border-color: #333333;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --surface-color: #f3f4f6;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --border-color: #d1d5db;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Защита от лишнего скролла body */
        }

        .surface { background-color: var(--surface-color); border: 1px solid var(--border-color); }
        .text-muted { color: var(--text-muted); }
        .accent-bg { background-color: var(--accent-color); color: #fff; }
        .accent-text { color: var(--accent-color); }
        .border-custom { border-color: var(--border-color); }

        /* Скроллбары */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        canvas { touch-action: none; image-rendering: pixelated; }

        /* Лейаут: ПК vs Мобилка */
        .app-container { display: flex; height: 100vh; w-full; }
        .sidebar { display: none; width: 260px; height: 100vh; flex-direction: column; border-right: 1px solid var(--border-color); background-color: var(--surface-color); z-index: 40; }
        .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background-color: var(--surface-color); border-top: 1px solid var(--border-color); z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
        .main-content { flex: 1; height: 100vh; overflow-y: auto; padding: 1.5rem; padding-bottom: 120px; } /* padding-bottom 120px железобетонно */

        /* Конструктор Лейаут */
        .constructor-layout { display: flex; flex-direction: column; gap: 1.5rem; height: 100%; }
        .canvas-area { flex: 1; overflow: auto; border: 1px dashed var(--border-color); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; background-color: var(--surface-color); position: relative; }

        @media (min-width: 1024px) {
            .sidebar { display: flex; }
            .bottom-nav { display: none; }
            .main-content { padding-bottom: 2rem; } /* На ПК убираем огромный отступ снизу */
            .constructor-layout { flex-direction: row; }
            .settings-panel { width: 320px; flex-shrink: 0; overflow-y: auto; padding-right: 1rem; }
        }

        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; color: var(--text-muted); transition: color 0.2s; }
        .nav-btn.active { color: var(--accent-color); }
        .nav-btn:hover { color: var(--accent-color); }
        .pc-nav-btn { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem; color: var(--text-muted); transition: all 0.2s; border-left: 3px solid transparent; }
        .pc-nav-btn.active { color: var(--accent-color); border-left-color: var(--accent-color); background-color: rgba(128, 128, 128, 0.05); }
        .pc-nav-btn:hover { background-color: rgba(128, 128, 128, 0.1); }

        .btn { padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: opacity 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        
        .input-base { width: 100%; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.75rem; border-radius: 0.5rem; outline: none; transition: border-color 0.2s; }
        .input-base:focus { border-color: var(--accent-color); }
        
        /* Палитра */
        .color-swatch { width: 2rem; height: 2rem; border-radius: 0.25rem; border: 1px solid var(--border-color); cursor: pointer; position: relative; }
        .color-swatch.active::after { content: ''; position: absolute; inset: -4px; border: 2px solid var(--accent-color); border-radius: 0.35rem; }
        
        .hidden-tab { display: none !important; }
    </style>
</head>
<body data-theme="minimal">

<div class="app-container">
    <aside class="sidebar">
        <div class="p-6 border-b border-custom">
            <div class="text-xs font-bold tracking-widest text-muted uppercase">Digital Canvas</div>
            <h1 class="text-xl font-bold mt-1">Filum</h1>
        </div>
        <nav class="flex-1 py-4 flex flex-col gap-1" id="pc-nav">
            <button class="pc-nav-btn active" data-target="processes"><i class="fas fa-layer-group w-5"></i> Процессы</button>
            <button class="pc-nav-btn" data-target="constructor"><i class="fas fa-border-all w-5"></i> Конструктор</button>
            <button class="pc-nav-btn" data-target="counter"><i class="fas fa-hashtag w-5"></i> Счётчик</button>
            <button class="pc-nav-btn" data-target="calculator"><i class="fas fa-calculator w-5"></i> Калькулятор</button>
            <button class="pc-nav-btn mt-auto" data-target="settings"><i class="fas fa-cog w-5"></i> Настройки</button>
        </nav>
    </aside>

    <main class="main-content relative" id="main-scroll">
        
        <header class="mb-8 lg:hidden flex justify-between items-center">
            <div>
                <div class="text-[10px] font-bold tracking-widest text-muted uppercase">Digital Canvas</div>
                <h1 class="text-2xl font-bold">Filum</h1>
            </div>
            <button class="p-2 text-muted" onclick="switchTab('settings')"><i class="fas fa-cog text-xl"></i></button>
        </header>

        <div class="mb-6 hidden lg:block">
            <h2 class="text-3xl font-bold" id="page-title">Ваше пространство для творчества.</h2>
        </div>

        <section id="tab-processes" class="tab-content block">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold">Текущие работы</h3>
                <button class="btn accent-bg text-sm" onclick="switchTab('constructor')"><i class="fas fa-plus"></i> Создать</button>
            </div>
            <div id="processes-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                </div>
        </section>

        <section id="tab-constructor" class="tab-content hidden-tab h-full">
            <div class="constructor-layout">
                <div class="settings-panel surface p-4 rounded-xl flex flex-col gap-6">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-muted mb-2 font-bold">Размер сетки (Ш x В)</label>
                        <div class="flex gap-2">
                            <input type="number" id="grid-w" value="40" class="input-base text-center" min="10" max="150">
                            <span class="flex items-center text-muted">×</span>
                            <input type="number" id="grid-h" value="40" class="input-base text-center" min="10" max="150">
                            <button id="apply-grid" class="btn surface border border-custom"><i class="fas fa-check"></i></button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs uppercase tracking-wider text-muted mb-2 font-bold">Инструменты</label>
                        <div class="flex gap-2">
                            <button class="btn surface border border-custom flex-1 tool-btn active" data-tool="draw" style="color: var(--accent-color); border-color: var(--accent-color);"><i class="fas fa-pen"></i></button>
                            <button class="btn surface border border-custom flex-1 tool-btn" data-tool="erase"><i class="fas fa-eraser"></i></button>
                            <button class="btn surface border border-custom flex-1" onclick="clearCanvas()"><i class="fas fa-trash-alt text-red-400"></i></button>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs uppercase tracking-wider text-muted font-bold">Палитра</label>
                            <button id="add-color-btn" class="text-xs text-muted hover:text-[var(--text-main)]"><i class="fas fa-plus"></i></button>
                            <input type="color" id="hidden-color-picker" class="hidden">
                        </div>
                        <div id="palette-container" class="flex flex-wrap gap-3">
                            </div>
                    </div>

                    <div class="mt-auto border-t border-custom pt-4">
                        <label class="block text-xs uppercase tracking-wider text-muted mb-2 font-bold">Умная пикселизация</label>
                        <input type="file" id="image-upload" accept="image/*" class="hidden">
                        <label for="image-upload" class="btn w-full surface border border-custom text-sm justify-center cursor-pointer mb-2">
                            <i class="fas fa-image"></i> Из фото в схему
                        </label>
                        <button class="btn w-full accent-bg text-sm justify-center" onclick="saveProcess()">
                            <i class="fas fa-save"></i> Сохранить процесс
                        </button>
                    </div>
                </div>

                <div class="canvas-area">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>
        </section>

        <section id="tab-counter" class="tab-content hidden-tab h-full flex flex-col items-center justify-center">
            <div class="text-center mb-12">
                <span class="text-sm font-bold tracking-widest text-muted uppercase">Текущий ряд</span>
                <div id="row-display" class="text-8xl font-bold accent-text mt-2">0</div>
            </div>
            
            <div class="flex items-end gap-8 mb-12">
                <button onclick="updateRow(-1)" class="w-16 h-16 rounded-full surface border border-custom flex items-center justify-center text-xl transition-transform active:scale-90 text-muted hover:text-[var(--text-main)]">
                    <i class="fas fa-minus"></i>
                </button>
                <button onclick="updateRow(1)" class="w-32 h-32 rounded-full accent-bg flex items-center justify-center text-5xl transition-transform active:scale-95 shadow-lg">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <button onclick="updateRow(0, true)" class="text-sm text-muted hover:underline"><i class="fas fa-redo text-xs"></i> Сбросить счётчик</button>
        </section>

        <section id="tab-calculator" class="tab-content hidden-tab max-w-md mx-auto">
            <div class="surface p-6 rounded-xl border border-custom flex flex-col gap-4">
                <div>
                    <label class="block text-sm text-muted mb-1">Стоимость материалов (₽)</label>
                    <input type="number" id="calc-mat" class="input-base" placeholder="0" oninput="calculate()">
                </div>
                <div>
                    <label class="block text-sm text-muted mb-1">Затрачено часов</label>
                    <input type="number" id="calc-time" class="input-base" placeholder="0" oninput="calculate()">
                </div>
                <div>
                    <label class="block text-sm text-muted mb-1">Стоимость часа (₽)</label>
                    <input type="number" id="calc-rate" class="input-base" placeholder="0" oninput="calculate()">
                </div>
                <div class="border-t border-custom pt-4 mt-2 text-center">
                    <span class="text-sm text-muted uppercase tracking-wider font-bold">Итоговая стоимость</span>
                    <div id="calc-total" class="text-4xl font-bold accent-text mt-1">0 ₽</div>
                </div>
            </div>
        </section>

        <section id="tab-settings" class="tab-content hidden-tab max-w-md mx-auto">
            <h3 class="text-xl font-semibold mb-6">Настройки</h3>
            
            <div class="mb-8">
                <label class="block text-xs uppercase tracking-wider text-muted mb-3 font-bold">Цветовая схема</label>
                <div class="grid grid-cols-2 gap-3">
                    <button class="btn surface border border-custom text-sm" onclick="setTheme('minimal')">Минимализм</button>
                    <button class="btn surface border border-custom text-sm" onclick="setTheme('neon')">Неон/Фиолет</button>
                    <button class="btn surface border border-custom text-sm" onclick="setTheme('cyberdark')">Кибер-Тьма</button>
                    <button class="btn surface border border-custom text-sm" onclick="setTheme('light')">Светлая</button>
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-xs uppercase tracking-wider text-muted mb-3 font-bold">Данные (Без регистрации)</label>
                <div class="flex gap-3">
                    <button class="btn surface border border-custom flex-1 text-sm" onclick="exportData()"><i class="fas fa-file-export"></i> Экспорт</button>
                    <label class="btn surface border border-custom flex-1 text-sm cursor-pointer m-0">
                        <i class="fas fa-file-import"></i> Импорт
                        <input type="file" class="hidden" accept=".json" onchange="importData(event)">
                    </label>
                </div>
                <p class="text-xs text-muted mt-2">Скачайте файл .json для переноса всех процессов и настроек на другое устройство.</p>
                <button class="btn surface border border-red-900/30 text-red-400 mt-4 w-full text-sm" onclick="clearAllData()"><i class="fas fa-bomb"></i> Удалить все данные устройства</button>
            </div>
        </section>

    </main>

    <nav class="bottom-nav" id="mobile-nav">
        <button class="nav-btn active" data-target="processes"><i class="fas fa-layer-group text-xl mb-1"></i><span class="text-[10px]">Процессы</span></button>
        <button class="nav-btn" data-target="constructor"><i class="fas fa-border-all text-xl mb-1"></i><span class="text-[10px]">Схема</span></button>
        <button class="nav-btn" data-target="counter"><i class="fas fa-hashtag text-xl mb-1"></i><span class="text-[10px]">Счётчик</span></button>
        <button class="nav-btn" data-target="calculator"><i class="fas fa-calculator text-xl mb-1"></i><span class="text-[10px]">Калькулятор</span></button>
    </nav>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // === СОСТОЯНИЕ (STATE) ===
    let state = {
        theme: 'minimal',
        palette: ['#000000', '#ffffff', '#ff0000', '#00ff00', '#0000ff', '#8b5cf6'],
        activeColor: '#000000',
        processes: [],
        counter: 0,
        grid: { w: 40, h: 40, data: [] },
        tool: 'draw' // draw, erase
    };

    // Инициализация LocalStorage
    const loadState = () => {
        const saved = localStorage.getItem('filum_state');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
                if (!state.grid.data || state.grid.data.length !== state.grid.h) initEmptyGrid();
            } catch (e) { console.error('Ошибка загрузки', e); }
        } else {
            initEmptyGrid();
        }
    };

    const saveState = () => {
        localStorage.setItem('filum_state', JSON.stringify(state));
    };

    const initEmptyGrid = () => {
        state.grid.data = Array(state.grid.h).fill().map(() => Array(state.grid.w).fill(null));
    };

    // === ИНТЕРФЕЙС И НАВИГАЦИЯ ===
    window.setTheme = (themeName) => {
        document.body.setAttribute('data-theme', themeName);
        state.theme = themeName;
        saveState();
    };

    window.switchTab = (targetId) => {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden-tab'));
        const targetEl = document.getElementById(`tab-${targetId}`);
        if(targetEl) targetEl.classList.remove('hidden-tab');

        // Подсветка кнопок
        document.querySelectorAll('.nav-btn, .pc-nav-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.style.borderColor = 'transparent';
            btn.style.backgroundColor = 'transparent';
            
            if (btn.dataset.target === targetId) {
                btn.classList.add('active');
                if(btn.classList.contains('pc-nav-btn')) {
                    btn.style.borderColor = 'var(--accent-color)';
                    btn.style.backgroundColor = 'rgba(128, 128, 128, 0.05)';
                }
            }
        });
        
        // Ререндер канваса если нужно
        if (targetId === 'constructor') setTimeout(renderCanvas, 50);
        if (targetId === 'processes') renderProcesses();
    };

    document.querySelectorAll('[data-target]').forEach(btn => {
        btn.addEventListener('click', (e) => switchTab(e.currentTarget.dataset.target));
    });

    // === КОНСТРУКТОР & КАНВАС ===
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let cellSize = 15;

    const resizeCanvas = () => {
        // Определение размера клетки на основе экрана и сетки
        const container = canvas.parentElement;
        const maxW = container.clientWidth - 20;
        const maxH = container.clientHeight - 20;
        
        const cellW = Math.floor(maxW / state.grid.w);
        const cellH = Math.floor(maxH / state.grid.h);
        cellSize = Math.max(Math.min(cellW, cellH), 5); // минимум 5px
        
        canvas.width = state.grid.w * cellSize;
        canvas.height = state.grid.h * cellSize;
    };

    const renderCanvas = () => {
        resizeCanvas();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Отрисовка клеток
        for (let y = 0; y < state.grid.h; y++) {
            for (let x = 0; x < state.grid.w; x++) {
