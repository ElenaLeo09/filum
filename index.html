<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Filum - Цифровой холст</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Тематические переменные */
        :root {
            /* Минимализм (по умолчанию) */
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --card-bg: #f3f4f6;
            --accent-color: #4b5563;
        }

        /* Кибер-Неон */
        [data-theme="cyber"] {
            --bg-color: #0f001a;
            --text-color: #e0e0e0;
            --card-bg: #1a0033;
            --accent-color: #00ffcc; /* Мятный неон */
            --accent-hover: #00ccaa;
        }

        /* Пудровая Роза */
        [data-theme="rose"] {
            --bg-color: #fff0f5;
            --text-color: #4a3b3f;
            --card-bg: #ffe4e1;
            --accent-color: #d8bfd8;
        }

        /* Лесная Прохлада */
        [data-theme="forest"] {
            --bg-color: #1e2e26;
            --text-color: #e2e8f0;
            --card-bg: #2a3f34;
            --accent-color: #4ade80;
        }

        /* Ночной режим (глобальный оверрайд, если включен) */
        [data-mode="dark"] {
            filter: brightness(0.85) contrast(1.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .card { background-color: var(--card-bg); }
        .accent-bg { background-color: var(--accent-color); color: #fff; }
        .accent-text { color: var(--accent-color); }
        .border-accent { border-color: var(--accent-color); }

        /* Кастомный скроллбар для холста */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 10px; }

        .nav-item.active { border-bottom: 3px solid var(--accent-color); color: var(--accent-color); }
        
        canvas {
            touch-action: none;
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden" data-theme="cyber" data-mode="light">

    <header class="p-4 flex justify-between items-center shadow-md z-10 card">
        <h1 class="text-2xl font-bold tracking-widest uppercase accent-text">Filum</h1>
        <div class="flex gap-4">
            <button onclick="exportData()" class="p-2 rounded-full hover:opacity-80"><i class="fas fa-file-export"></i></button>
            <label class="p-2 rounded-full hover:opacity-80 cursor-pointer">
                <i class="fas fa-file-import"></i>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </label>
            <button onclick="toggleSettings()" class="p-2 rounded-full hover:opacity-80"><i class="fas fa-cog"></i></button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-24 relative" id="main-content">
        
        <section id="tab-projects" class="block space-y-4">
            <h2 class="text-xl font-bold mb-4">Мои процессы</h2>
            <div id="projects-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
            <button onclick="createNewProject()" class="w-full p-4 rounded-2xl accent-bg font-bold shadow-lg shadow-[var(--accent-color)]/20 mt-4 text-gray-900">+ Новый процесс</button>
        </section>

        <section id="tab-counter" class="hidden h-full flex-col justify-center items-center space-y-8">
            <div class="text-center">
                <p class="text-sm opacity-70 uppercase tracking-widest">Текущий ряд</p>
                <div id="row-count" class="text-8xl font-bold accent-text drop-shadow-md">0</div>
            </div>
            <div class="flex items-end gap-6 w-full max-w-md justify-center">
                <button onclick="updateRow(-1)" class="w-16 h-16 rounded-full card text-xl shadow-md border-2 border-accent opacity-80 flex items-center justify-center">
                    <i class="fas fa-minus"></i>
                </button>
                <button onclick="updateRow(1)" class="w-32 h-32 rounded-full accent-bg text-5xl shadow-xl flex items-center justify-center text-gray-900 transform active:scale-95 transition-transform">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="w-full max-w-xs mt-8">
                <label class="text-sm opacity-70">Оповещение каждые X рядов:</label>
                <input type="number" id="alert-interval" class="w-full p-3 rounded-xl card border border-gray-600 mt-2 bg-transparent text-center text-xl outline-none border-accent" value="10">
            </div>
        </section>

        <section id="tab-canvas" class="hidden h-full flex-col">
            <div class="flex gap-2 mb-4 justify-between items-center">
                <input type="color" id="colorPicker" value="#00ffcc" class="w-10 h-10 rounded cursor-pointer border-0 p-0 bg-transparent">
                <div class="flex gap-2">
                    <button onclick="setDrawMode('draw')" class="p-3 rounded-xl card active-tool border-2 border-accent"><i class="fas fa-paint-brush"></i></button>
                    <button onclick="setDrawMode('erase')" class="p-3 rounded-xl card"><i class="fas fa-eraser"></i></button>
                </div>
                <label class="p-3 rounded-xl card cursor-pointer accent-text font-bold text-sm">
                    Из фото
                    <input type="file" id="imageUpload" class="hidden" accept="image/*" onchange="imageToPixelArt(event)">
                </label>
            </div>
            <div class="flex-1 w-full overflow-auto border-2 border-dashed border-gray-600 rounded-xl flex justify-center items-center relative card">
                <canvas id="patternCanvas" class="bg-white shadow-lg cursor-crosshair"></canvas>
            </div>
        </section>

        <section id="tab-calc" class="hidden space-y-4 max-w-md mx-auto mt-4">
            <h2 class="text-xl font-bold mb-4 text-center">Калькулятор стоимости</h2>
            <div class="space-y-4 card p-6 rounded-2xl">
                <div>
                    <label class="text-sm opacity-70">Материалы (₽)</label>
                    <input type="number" id="calc-materials" class="w-full p-3 rounded-xl bg-transparent border-2 border-accent outline-none" placeholder="0">
                </div>
                <div>
                    <label class="text-sm opacity-70">Время работы (Часы)</label>
                    <input type="number" id="calc-time" class="w-full p-3 rounded-xl bg-transparent border-2 border-accent outline-none" placeholder="0">
                </div>
                <div>
                    <label class="text-sm opacity-70">Желаемая ставка (₽/час)</label>
                    <input type="number" id="calc-rate" class="w-full p-3 rounded-xl bg-transparent border-2 border-accent outline-none" placeholder="0">
                </div>
                <button onclick="calculatePrice()" class="w-full p-4 rounded-xl accent-bg font-bold text-gray-900 mt-2">Рассчитать</button>
                <div class="text-center mt-6">
                    <p class="text-sm opacity-70">Справедливая цена:</p>
                    <div id="calc-result" class="text-4xl font-bold accent-text mt-2">0 ₽</div>
                </div>
            </div>
        </section>

    </main>

    <nav class="fixed bottom-0 w-full card flex justify-around p-2 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20">
        <button onclick="switchTab('projects')" class="nav-item active flex-1 py-3 text-center rounded-xl transition-colors"><i class="fas fa-list-ul text-xl"></i></button>
        <button onclick="switchTab('counter')" class="nav-item flex-1 py-3 text-center rounded-xl transition-colors"><i class="fas fa-sort-numeric-up text-xl"></i></button>
        <button onclick="switchTab('canvas')" class="nav-item flex-1 py-3 text-center rounded-xl transition-colors"><i class="fas fa-border-all text-xl"></i></button>
        <button onclick="switchTab('calc')" class="nav-item flex-1 py-3 text-center rounded-xl transition-colors"><i class="fas fa-calculator text-xl"></i></button>
    </nav>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="card p-6 rounded-3xl w-full max-w-sm">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Настройки</h3>
                <button onclick="toggleSettings()" class="text-2xl">&times;</button>
            </div>
            
            <div class="space-y-6">
                <div>
                    <p class="mb-3 font-bold opacity-80">Тема оформления</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="setTheme('minimal')" class="p-3 rounded-xl border border-gray-500 text-sm">Минимализм</button>
                        <button onclick="setTheme('cyber')" class="p-3 rounded-xl border border-purple-500 text-sm text-[#00ffcc]">Кибер-Неон</button>
                        <button onclick="setTheme('rose')" class="p-3 rounded-xl border border-pink-300 text-sm">Пудровая Роза</button>
                        <button onclick="setTheme('forest')" class="p-3 rounded-xl border border-green-500 text-sm">Лесная Прохлада</button>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <p class="font-bold opacity-80">Ночной режим</p>
                    <input type="checkbox" id="darkModeToggle" class="w-6 h-6 accent-[var(--accent-color)]" onchange="toggleDarkMode(this.checked)">
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let state = JSON.parse(localStorage.getItem('filum_data')) || {
            theme: 'cyber',
            darkMode: false,
            projects: [],
            currentProjectIndex: 0
        };
        let currentRow = 0;
        let drawMode = 'draw';
        
        // Canvas config
        const GRID_SIZE = 30;
        const CELL_SIZE = 15;
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let gridData = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(''));

        // --- Initialization ---
        function init() {
            document.body.setAttribute('data-theme', state.theme);
            document.body.setAttribute('data-mode', state.darkMode ? 'dark' : 'light');
            document.getElementById('darkModeToggle').checked = state.darkMode;
            renderProjects();
            initCanvas();
        }

        function saveData() {
            localStorage.setItem('filum_data', JSON.stringify(state));
        }

        // --- UI Navigation ---
        function switchTab(tabId) {
            ['projects', 'counter', 'canvas', 'calc'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.add('hidden');
            });
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add(tabId === 'counter' || tabId === 'canvas' ? 'flex' : 'block');
            event.currentTarget.classList.add('active');
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
        }

        // --- Themes ---
        function setTheme(theme) {
            state.theme = theme;
            document.body.setAttribute('data-theme', theme);
            saveData();
        }

        function toggleDarkMode(isDark) {
            state.darkMode = isDark;
            document.body.setAttribute('data-mode', isDark ? 'dark' : 'light');
            saveData();
        }

        // --- Row Counter ---
        function updateRow(change) {
            currentRow += change;
            if (currentRow < 0) currentRow = 0;
            document.getElementById('row-count').innerText = currentRow;
            
            const interval = parseInt(document.getElementById('alert-interval').value);
            if (change > 0 && interval > 0 && currentRow % interval === 0) {
                // Визуальное оповещение
                const counter = document.getElementById('row-count');
                counter.classList.add('text-white', 'scale-125');
                setTimeout(() => counter.classList.remove('text-white', 'scale-125'), 300);
                if (navigator.vibrate) navigator.vibrate(200);
            }
        }

        // --- Canvas & Drawing ---
        function initCanvas() {
            canvas.width = GRID_SIZE * CELL_SIZE;
            canvas.height = GRID_SIZE * CELL_SIZE;
            drawGrid();
            
            // Touch/Mouse events
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);
            
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e.touches[0]); }, {passive: false});
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); }, {passive: false});
            canvas.addEventListener('touchend', stopDraw);
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    if (gridData[y][x]) {
                        ctx.fillStyle = gridData[y][x];
                        ctx.fillRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                    ctx.strokeStyle = '#e5e7eb';
                    ctx.strokeRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }
        }

        function setDrawMode(mode) {
            drawMode = mode;
        }

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) / (rect.width / canvas.width) / CELL_SIZE),
                y: Math.floor((e.clientY - rect.top) / (rect.height / canvas.height) / CELL_SIZE)
            };
        }

        function startDraw(e) {
            isDrawing = true;
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getCanvasPos(e);
            if (pos.x >= 0 && pos.x < GRID_SIZE && pos.y >= 0 && pos.y < GRID_SIZE) {
                gridData[pos.y][pos.x] = drawMode === 'draw' ? document.getElementById('colorPicker').value : '';
                drawGrid();
            }
        }

        function stopDraw() { isDrawing = false; }

        function imageToPixelArt(e) {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = () => {
                const tempCanvas = document.createElement('canvas');
                const tCtx = tempCanvas.getContext('2d');
                tempCanvas.width = GRID_SIZE;
                tempCanvas.height = GRID_SIZE;
                tCtx.drawImage(img, 0, 0, GRID_SIZE, GRID_SIZE);
                
                for(let y=0; y<GRID_SIZE; y++) {
                    for(let x=0; x<GRID_SIZE; x++) {
                        const pixel = tCtx.getImageData(x, y, 1, 1).data;
                        gridData[y][x] = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
                    }
                }
                drawGrid();
            };
            img.src = URL.createObjectURL(file);
        }

        // --- Calculator ---
        function calculatePrice() {
            const mat = parseFloat(document.getElementById('calc-materials').value) || 0;
            const time = parseFloat(document.getElementById('calc-time').value) || 0;
            const rate = parseFloat(document.getElementById('calc-rate').value) || 0;
            const total = mat + (time * rate);
            document.getElementById('calc-result').innerText = total.toFixed(2) + ' ₽';
        }

        // --- Data Sync (Import/Export) ---
        function exportData() {
            const dataStr = JSON.stringify(state);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = 'filum_progress.json';
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    state = JSON.parse(e.target.result);
                    saveData();
                    init();
                    alert("Данные успешно восстановлены!");
                } catch (err) {
                    alert("Ошибка чтения файла.");
                }
            };
            reader.readAsText(file);
        }

        // --- Projects Dummy (UI Demo) ---
        function renderProjects() {
            const list = document.getElementById('projects-list');
            list.innerHTML = `
                <div class="card p-5 rounded-2xl border-l-4 border-accent relative">
                    <h3 class="font-bold text-lg mb-2">Ночной процесс #1</h3>
                    <div class="w-full bg-gray-300 rounded-full h-2 mb-2 dark:bg-gray-700">
                        <div class="accent-bg h-2 rounded-full" style="width: 45%"></div>
                    </div>
                    <p class="text-xs opacity-70">Прогресс: 45% (300/666 рядов)</p>
                    <button class="absolute top-4 right-4 opacity-50 hover:opacity-100"><i class="fas fa-play"></i></button>
                </div>
            `;
        }

        function createNewProject() {
            alert("Здесь откроется окно создания нового проекта. В этой демо-версии UI настроен, логика готова к расширению.");
        }

        // Запуск
        init();
    </script>
</body>
</html>
